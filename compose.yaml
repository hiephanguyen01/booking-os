name: ${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:?POSTGRES_VERSION is required}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - booking-network

  redis:
    image: redis:${REDIS_VERSION:?REDIS_VERSION is required}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - booking-network

  minio:
    image: booking-os/minio:${MINIO_SERVER_VERSION:?MINIO_SERVER_VERSION is required}
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
      args:
        GO_IMAGE_VERSION: ${MINIO_GO_IMAGE_VERSION:?MINIO_GO_IMAGE_VERSION is required}
        ALPINE_VERSION: ${MINIO_ALPINE_VERSION:?ALPINE_VERSION is required}
        MINIO_SERVER_VERSION: ${MINIO_SERVER_VERSION:?MINIO_SERVER_VERSION is required}
        MINIO_CLIENT_VERSION: ${MINIO_CLIENT_VERSION:?MINIO_CLIENT_VERSION is required}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "${MINIO_API_PORT:?MINIO_API_PORT is required}:9000"
      - "${MINIO_CONSOLE_PORT:?MINIO_CONSOLE_PORT is required}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - booking-network

  minio-init:
    image: booking-os/minio:${MINIO_SERVER_VERSION:?MINIO_SERVER_VERSION is required}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /scripts/create-buckets.sh
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:?MINIO_DEFAULT_BUCKET is required}
    volumes:
      - ./infra/minio/create-buckets.sh:/scripts/create-buckets.sh:ro
    networks:
      - booking-network

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:?MAILPIT_VERSION is required}
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:?MAILPIT_SMTP_PORT is required}:1025"
      - "${MAILPIT_UI_PORT:?MAILPIT_UI_PORT is required}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - booking-network

  caddy:
    image: caddy:${CADDY_VERSION:?CADDY_VERSION is required}
    profiles:
      - https
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:?CADDY_HTTP_PORT is required}:80"
      - "${CADDY_HTTPS_PORT:?CADDY_HTTPS_PORT is required}:443"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - booking-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  booking-network:
    driver: bridge
