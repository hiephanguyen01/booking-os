name: Diagnose PR 5 merge conflicts

on:
  push:
    branches:
      - feat/booking-os-pilot-foundation

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/booking-os-pilot-foundation
          fetch-depth: 0

      - name: Persist merge conflict list
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f docs/tmp/pr5-conflicts.txt ]]; then
            echo "Conflict diagnostics already persisted."
            exit 0
          fi

          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          mkdir -p docs/tmp
          {
            echo "merge_status=${merge_status}"
            git diff --name-only --diff-filter=U
          } > docs/tmp/pr5-conflicts.txt

          git merge --abort >/dev/null 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tmp/pr5-conflicts.txt
          git commit -m "chore: record PR 5 merge conflicts"
          git push origin HEAD:feat/booking-os-pilot-foundation
