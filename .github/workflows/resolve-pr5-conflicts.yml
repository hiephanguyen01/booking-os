name: Diagnose PR 5 merge conflicts

on:
  push:
    branches:
      - feat/booking-os-pilot-foundation

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/booking-os-pilot-foundation
          fetch-depth: 0

      - name: Diagnose merge conflicts against main
        shell: bash
        run: |
          set +e
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          echo "merge_status=${merge_status}"
          echo "conflicted_files_begin"
          git diff --name-only --diff-filter=U
          echo "conflicted_files_end"
          git status --short
          git merge --abort >/dev/null 2>&1 || true
          exit 1
