name: Cleanup tenant verifier

on:
  push:
    branches:
      - feat/sprint-1a-tenant-isolation
    paths:
      - .github/workflows/cleanup-verifier.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-1a-tenant-isolation

      - name: Remove unused helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/modules/tenancy/infrastructure/persistence/tenant-policy-verifier.ts")
          content = path.read_text()
          block = '''function escapeRegExp(value: string): string {
            return value.replace(/[.*+?^${}()|[\\]\\\\]/g, "\\\\$&");
          }

          '''
          if content.count(block) != 1:
              raise SystemExit("Expected exactly one escapeRegExp helper")
          path.write_text(content.replace(block, ""))
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and format cleanup
        run: pnpm exec biome check --write apps/api/src/modules/tenancy/infrastructure/persistence/tenant-policy-verifier.ts

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/tenancy/infrastructure/persistence/tenant-policy-verifier.ts
          git commit -m "fix: remove unused verifier helper"
          git push origin HEAD:feat/sprint-1a-tenant-isolation
