name: Temporary lockfile generation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate pnpm lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Generate lockfile without executing dependency scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
