name: Scaffolding Runtime Smoke

on:
  push:
    branches:
      - chore/monorepo-scaffolding
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: scaffolding-runtime-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Start Redis
        run: |
          cp .env.docker.example .env.docker
          docker compose --env-file .env.docker up -d --wait redis

      - name: Smoke deployment units
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/booking-os-logs

          cleanup() {
            for pid in "${CRITICAL_PID:-}" "${BATCH_PID:-}" "${STOREFRONT_PID:-}" "${CONSOLE_PID:-}" "${API_PID:-}"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
              fi
            done
            pnpm infra:down >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_for_url() {
            local url="$1"
            for attempt in $(seq 1 60); do
              if curl --silent --fail "$url" >/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }

          wait_for_log() {
            local file="$1"
            local pattern="$2"
            for attempt in $(seq 1 60); do
              if grep --quiet "$pattern" "$file" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for $pattern in $file" >&2
            cat "$file" >&2 || true
            return 1
          }

          wait_for_expected_shutdown() {
            local pid="$1"
            local name="$2"
            local status=0

            wait "$pid" || status=$?
            if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
              echo "$name exited with unexpected status $status" >&2
              return "$status"
            fi
          }

          DATABASE_URL=postgresql://booking:booking@127.0.0.1:5432/booking_os \
            REDIS_URL=redis://127.0.0.1:6379/0 \
            node apps/api/dist/main.js > /tmp/booking-os-logs/api.log 2>&1 &
          API_PID=$!
          (
            cd apps/web-storefront
            exec node node_modules/next/dist/bin/next start -p 3000
          ) > /tmp/booking-os-logs/storefront.log 2>&1 &
          STOREFRONT_PID=$!
          (
            cd apps/web-console
            exec node node_modules/next/dist/bin/next start -p 3002
          ) > /tmp/booking-os-logs/console.log 2>&1 &
          CONSOLE_PID=$!
          node apps/worker-critical/dist/main.js > /tmp/booking-os-logs/critical.log 2>&1 &
          CRITICAL_PID=$!
          node apps/worker-batch/dist/main.js > /tmp/booking-os-logs/batch.log 2>&1 &
          BATCH_PID=$!

          wait_for_url http://localhost:3001/api/health
          wait_for_url http://localhost:3000
          wait_for_url http://localhost:3002
          wait_for_log /tmp/booking-os-logs/critical.log 'service.ready'
          wait_for_log /tmp/booking-os-logs/batch.log 'service.ready'

          curl --silent --fail http://localhost:3001/api/health | grep --quiet '"status":"ok"'
          curl --silent --fail http://localhost:3000 | grep --quiet 'Booking OS'
          curl --silent --fail http://localhost:3002 | grep --quiet 'Booking OS'

          pnpm --filter @booking-os/worker-critical smoke:enqueue
          pnpm --filter @booking-os/worker-batch smoke:enqueue
          wait_for_log /tmp/booking-os-logs/critical.log 'job.completed'
          wait_for_log /tmp/booking-os-logs/batch.log 'job.completed'

          kill -TERM "$CRITICAL_PID" "$BATCH_PID"
          wait_for_expected_shutdown "$CRITICAL_PID" worker-critical
          wait_for_expected_shutdown "$BATCH_PID" worker-batch
          wait_for_log /tmp/booking-os-logs/critical.log 'service.shutdown_started'
          wait_for_log /tmp/booking-os-logs/critical.log 'service.shutdown_completed'
          wait_for_log /tmp/booking-os-logs/batch.log 'service.shutdown_started'
          wait_for_log /tmp/booking-os-logs/batch.log 'service.shutdown_completed'
          unset CRITICAL_PID BATCH_PID

          kill -TERM "$API_PID" "$STOREFRONT_PID" "$CONSOLE_PID"
          wait_for_expected_shutdown "$API_PID" api
          wait_for_expected_shutdown "$STOREFRONT_PID" web-storefront
          wait_for_expected_shutdown "$CONSOLE_PID" web-console
          unset API_PID STOREFRONT_PID CONSOLE_PID

      - name: Upload smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scaffolding-runtime-smoke-${{ github.sha }}
          path: /tmp/booking-os-logs
          if-no-files-found: ignore
          retention-days: 3
