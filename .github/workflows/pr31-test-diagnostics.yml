name: PR 31 OpenAPI artifact regeneration

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: pr31-openapi-regeneration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-openapi:
    name: Regenerate OpenAPI artifacts
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      API_PREFIX: api
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:1/booking_os_openapi
      REDIS_URL: redis://127.0.0.1:1/15
      SESSION_SECRET: openapi-ci-only-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI artifacts
        run: pnpm api:generate

      - name: Verify generated diff scope
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -vE '^(packages/contracts/openapi/openapi\.json|packages/api-client/src/generated/schema\.ts|packages/api-client/src/generated/client\.ts)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected generated changes:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            packages/contracts/openapi/openapi.json \
            packages/api-client/src/generated/schema.ts \
            packages/api-client/src/generated/client.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate OpenAPI artifacts"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
