name: Bootstrap generated API client

on:
  push:
    branches:
      - feat/sprint-0-baseline
    paths:
      - package.json
      - pnpm-lock.yaml
      - apps/api/src/openapi/**
      - packages/contracts/openapi/openapi.json
      - scripts/openapi/**
      - .github/workflows/bootstrap-generated-client.yml

permissions:
  contents: write

concurrency:
  group: bootstrap-generated-client
  cancel-in-progress: true

jobs:
  generate-client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-0-baseline

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Refresh lockfile and install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate twice and prove byte stability
        run: |
          pnpm api:generate
          first_spec="$(sha256sum packages/contracts/openapi/openapi.json | cut -d ' ' -f1)"
          first_schema="$(sha256sum packages/api-client/src/generated/schema.ts | cut -d ' ' -f1)"
          first_client="$(sha256sum packages/api-client/src/generated/client.ts | cut -d ' ' -f1)"
          pnpm api:generate
          second_spec="$(sha256sum packages/contracts/openapi/openapi.json | cut -d ' ' -f1)"
          second_schema="$(sha256sum packages/api-client/src/generated/schema.ts | cut -d ' ' -f1)"
          second_client="$(sha256sum packages/api-client/src/generated/client.ts | cut -d ' ' -f1)"
          test "$first_spec" = "$second_spec"
          test "$first_schema" = "$second_schema"
          test "$first_client" = "$second_client"
          echo "OpenAPI SHA-256: $second_spec"
          echo "Schema SHA-256: $second_schema"
          echo "Client SHA-256: $second_client"

      - name: Commit generated artifacts when changed
        run: |
          if [ -z "$(git status --porcelain -- pnpm-lock.yaml packages/contracts/openapi/openapi.json packages/api-client/src/generated)" ]; then
            echo "Generated API artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml packages/contracts/openapi/openapi.json packages/api-client/src/generated
          git commit -m "feat: commit generated API client"
          git push origin HEAD:feat/sprint-0-baseline
