name: Bootstrap compatibility lockfile

on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/bootstrap-compatibility-lockfile.yml

permissions:
  contents: write

# Temporary workflow: remove immediately after pnpm-lock.yaml is current.
jobs:
  update-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile when changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update compatibility lockfile"
          git push origin "HEAD:${HEAD_REF}"
