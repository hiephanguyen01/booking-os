name: Fix API typecheck fixtures

on:
  push:
    branches:
      - feat/sprint-1a-tenant-isolation
    paths:
      - .github/workflows/fix-api-typecheck.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-1a-tenant-isolation

      - name: Apply targeted typecheck fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          environment_files = [
              Path("apps/api/src/health/health-response.factory.test.ts"),
              Path("apps/api/src/health/readiness-checker.test.ts"),
              Path("apps/api/src/health/readiness-coordinator.test.ts"),
              Path("apps/api/src/observability/http-logging.interceptor.test.ts"),
          ]
          needle = 'host: "127.0.0.1",\n'
          replacement = 'host: "127.0.0.1",\n    trustProxy: false,\n'
          for path in environment_files:
              content = path.read_text()
              if content.count(needle) != 1:
                  raise SystemExit(f"Expected one host fixture in {path}")
              path.write_text(content.replace(needle, replacement, 1))

          guard_path = Path(
              "apps/api/src/modules/tenancy/infrastructure/http/tenant-required.guard.test.ts"
          )
          guard_content = guard_path.read_text()
          cast = '} as ExecutionContext;'
          if guard_content.count(cast) != 1:
              raise SystemExit("Expected one ExecutionContext cast")
          guard_path.write_text(
              guard_content.replace(cast, '} as unknown as ExecutionContext;', 1)
          )
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed files
        run: >-
          pnpm exec biome check --write
          apps/api/src/health/health-response.factory.test.ts
          apps/api/src/health/readiness-checker.test.ts
          apps/api/src/health/readiness-coordinator.test.ts
          apps/api/src/observability/http-logging.interceptor.test.ts
          apps/api/src/modules/tenancy/infrastructure/http/tenant-required.guard.test.ts

      - name: Verify workspace typecheck
        run: pnpm typecheck

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/api/src/health/health-response.factory.test.ts \
            apps/api/src/health/readiness-checker.test.ts \
            apps/api/src/health/readiness-coordinator.test.ts \
            apps/api/src/observability/http-logging.interceptor.test.ts \
            apps/api/src/modules/tenancy/infrastructure/http/tenant-required.guard.test.ts
          git commit -m "fix: satisfy API typecheck fixtures"
          git push origin HEAD:feat/sprint-1a-tenant-isolation
