name: Task 6 unit diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-unit-diagnostic:
    name: API unit diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_os_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm --filter @booking-os/api prisma:validate

      - name: Apply database migrations
        run: pnpm --filter @booking-os/api prisma:migrate:deploy

      - name: Build API dependency graph
        run: pnpm exec turbo run build --filter=@booking-os/api

      - name: Run identity outbox unit test with focused failure annotation
        shell: bash
        run: |
          set +e
          pnpm --filter @booking-os/api exec node --test --test-concurrency=1 --import tsx src/modules/identity/infrastructure/persistence/prisma/prisma-identity-outbox.adapter.test.ts 2>&1 | tee /tmp/task6-identity-outbox.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/task6-identity-outbox.log").read_text(encoding="utf-8", errors="replace").splitlines()
          markers = (
              "not ok ",
              "AssertionError",
              "ERR_ASSERTION",
              "TypeError:",
              "ReferenceError:",
              "Error:",
          )
          indexes = [i for i, line in enumerate(lines) if any(marker in line for marker in markers)]
          index = indexes[0] if indexes else max(0, len(lines) - 80)
          start = max(0, index - 8)
          end = min(len(lines), index + 40)
          excerpt = []
          for line in lines[start:end]:
              excerpt.append(line[:1200])
          safe = "\n".join(excerpt).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Task 6 identity outbox root cause::{safe}")
          PY
            exit "$status"
          fi
