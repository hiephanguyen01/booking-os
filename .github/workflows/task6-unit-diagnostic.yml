name: Task 6 unit diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security-diagnostic:
    name: Dependency security diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve patched Nano ID and verify audit
        shell: bash
        run: |
          set -euo pipefail
          echo "nanoid version: $(pnpm view nanoid@3.3.18 version)"
          echo "nanoid integrity: $(pnpm view nanoid@3.3.18 dist.integrity)"
          echo "postcss nanoid range: $(pnpm view postcss@8.5.18 dependencies.nanoid)"

          node <<'NODE'
          const fs = require("node:fs");
          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          packageJson.pnpm ??= {};
          packageJson.pnpm.overrides ??= {};
          packageJson.pnpm.overrides.nanoid = "3.3.18";
          fs.writeFileSync("package.json", `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE

          pnpm install --lockfile-only
          git diff -- package.json pnpm-lock.yaml | tee /tmp/nanoid-security.diff
          pnpm audit --audit-level high

          python - <<'PY'
          from pathlib import Path
          text = Path("/tmp/nanoid-security.diff").read_text(encoding="utf-8", errors="replace")
          safe = text[:24000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Nano ID patched lockfile diff::{safe}")
          PY
