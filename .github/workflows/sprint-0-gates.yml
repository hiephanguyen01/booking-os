name: Sprint 0 gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      API_PREFIX: api
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:1/booking_os_openapi
      REDIS_URL: redis://127.0.0.1:1/15
      SESSION_SECRET: openapi-ci-only-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject stale generated artifacts
        run: pnpm api:check-generated

      - name: Upload regenerated API artifacts for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-api-artifacts
          path: |
            packages/contracts/openapi/openapi.json
            packages/api-client/src/generated/schema.ts
            packages/api-client/src/generated/client.ts
          retention-days: 1

      - name: Commit regenerated API artifacts to PR branch
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          rm -rf /tmp/regenerated-api-artifacts
          mkdir -p /tmp/regenerated-api-artifacts/contracts/openapi
          mkdir -p /tmp/regenerated-api-artifacts/api-client/src/generated
          cp packages/contracts/openapi/openapi.json /tmp/regenerated-api-artifacts/contracts/openapi/openapi.json
          cp packages/api-client/src/generated/schema.ts /tmp/regenerated-api-artifacts/api-client/src/generated/schema.ts
          cp packages/api-client/src/generated/client.ts /tmp/regenerated-api-artifacts/api-client/src/generated/client.ts
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          cp /tmp/regenerated-api-artifacts/contracts/openapi/openapi.json packages/contracts/openapi/openapi.json
          cp /tmp/regenerated-api-artifacts/api-client/src/generated/schema.ts packages/api-client/src/generated/schema.ts
          cp /tmp/regenerated-api-artifacts/api-client/src/generated/client.ts packages/api-client/src/generated/client.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi/openapi.json packages/api-client/src/generated/schema.ts packages/api-client/src/generated/client.ts
          git diff --cached --quiet && exit 0
          git commit -m "chore(api): refresh generated OpenAPI artifacts"
          git push origin HEAD:"$HEAD_REF"

      - name: Typecheck generated API client
        run: pnpm --filter @booking-os/api-client typecheck

      - name: Test repository generators
        run: pnpm test:scripts

  genesis-tooling:
    name: Genesis tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Genesis tooling
        run: python -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Validate Genesis artifacts
        run: python tools/genesis_cli.py validate
