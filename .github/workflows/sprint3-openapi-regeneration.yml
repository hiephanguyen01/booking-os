name: Sprint 3 OpenAPI regeneration

on:
  push:
    branches:
      - feat/sprint-3-partner-foundation-onboarding

permissions:
  contents: write

concurrency:
  group: sprint3-openapi-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-3-partner-foundation-onboarding
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate canonical API artifacts
        env:
          NODE_ENV: test
          API_PREFIX: api
          DATABASE_URL: postgresql://booking:booking@127.0.0.1:1/booking_os_openapi
          REDIS_URL: redis://127.0.0.1:1/15
          SESSION_SECRET: openapi-generation-only-secret-at-least-32-characters
          PAYMENT_PROVIDER: mock
        run: pnpm api:generate

      - name: Commit generated artifacts when changed
        run: |
          git add packages/contracts/openapi/openapi.json packages/api-client/src/generated/schema.ts packages/api-client/src/generated/client.ts
          if git diff --cached --quiet; then
            echo "Generated artifacts already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate API contract"
          git push origin HEAD:feat/sprint-3-partner-foundation-onboarding
