name: Bootstrap OpenAPI baseline

on:
  push:
    branches:
      - feat/sprint-0-baseline
    paths:
      - apps/api/src/openapi/**
      - apps/api/src/health/health.controller.ts
      - apps/api/package.json
      - pnpm-lock.yaml
      - .github/workflows/bootstrap-openapi-baseline.yml

permissions:
  contents: write

jobs:
  generate-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-0-baseline

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate twice and prove byte stability
        run: |
          pnpm --filter @booking-os/api openapi:generate
          first="$(sha256sum packages/contracts/openapi/openapi.json | cut -d ' ' -f1)"
          pnpm --filter @booking-os/api openapi:generate
          second="$(sha256sum packages/contracts/openapi/openapi.json | cut -d ' ' -f1)"
          test "$first" = "$second"
          echo "OpenAPI SHA-256: $second"

      - name: Commit initial baseline when changed
        run: |
          if [ -z "$(git status --porcelain -- packages/contracts/openapi/openapi.json)" ]; then
            echo "OpenAPI baseline already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/contracts/openapi/openapi.json
          git commit -m "feat: commit supported OpenAPI baseline"
          git push origin HEAD:feat/sprint-0-baseline
