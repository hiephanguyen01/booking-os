name: PR 5 conflict maintenance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/booking-os-pilot-foundation
          fetch-depth: 0

      - name: Persist conflict diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicted_files="$(git diff --name-only --diff-filter=U)"
          git merge --abort >/dev/null 2>&1 || true

          mkdir -p docs/tmp
          {
            echo "merge_status=${merge_status}"
            printf '%s\n' "${conflicted_files}"
          } > docs/tmp/pr5-conflicts.txt

          git add docs/tmp/pr5-conflicts.txt
          git commit -m "chore: record PR 5 merge conflicts"
          git push origin HEAD:feat/booking-os-pilot-foundation
