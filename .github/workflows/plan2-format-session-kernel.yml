name: Plan 2 format session kernel

on:
  push:
    branches:
      - feat/sprint-1b-02-session-kernel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/sprint-1b-02-session-kernel
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format session application files
        run: |
          pnpm exec biome format --write \
            apps/api/src/modules/sessions/application/use-cases/create-session.ts \
            apps/api/src/modules/sessions/application/use-cases/refresh-session.ts \
            apps/api/src/modules/sessions/application/use-cases/validate-session.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/sessions/application/use-cases
          git commit -m "style(session): format application kernel"
          git push origin HEAD:feat/sprint-1b-02-session-kernel
