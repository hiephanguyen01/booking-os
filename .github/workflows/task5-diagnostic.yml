name: Task 5 diagnostic

on:
  push:
    branches:
      - feat/sprint-1b-04-task4-authorization-endpoint

permissions:
  contents: read

jobs:
  auth-security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_os_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @booking-os/api prisma:migrate:deploy
      - name: Run only Task 5 auth security regression
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @booking-os/api exec node ../../scripts/prisma/generate-shared-client.mjs
          pnpm --filter @booking-os/api exec node --test --test-concurrency=1 --import tsx test/auth-security-regression.e2e.test.ts 2>&1 | tee task5-diagnostic.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task5-diagnostic-log
          path: task5-diagnostic.log
