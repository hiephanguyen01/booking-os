name: Task 5 diagnostic

on:
  push:
    branches:
      - feat/sprint-1b-04-task4-authorization-endpoint

permissions:
  contents: read

concurrency:
  group: task5-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_os_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U booking -d booking_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_os_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: |
          pnpm --filter @booking-os/contracts build
          pnpm --filter @booking-os/observability build
          pnpm --filter @booking-os/auth build
          pnpm --filter @booking-os/testing build
      - run: pnpm --filter @booking-os/api prisma:migrate:deploy
      - name: Run Task 5 focused regressions and API unit suite
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @booking-os/api exec node ../../scripts/prisma/generate-shared-client.mjs
          : > "$GITHUB_WORKSPACE/task5-diagnostic.log"
          status=0
          set +e
          run_test() {
            label="$1"; shift
            echo "=== $label ===" | tee -a "$GITHUB_WORKSPACE/task5-diagnostic.log"
            "$@" 2>&1 | tee -a "$GITHUB_WORKSPACE/task5-diagnostic.log"
            code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then status=1; fi
          }
          run_test auth-security-regression pnpm --filter @booking-os/api exec node --test --test-concurrency=1 --import tsx test/auth-security-regression.e2e.test.ts
          run_test observability-redaction pnpm --filter @booking-os/observability exec node --test --import tsx tests/redaction.test.ts
          run_test observability-logger pnpm --filter @booking-os/observability exec node --test --import tsx tests/logger.test.ts
          run_test outbox-diagnostics pnpm --filter @booking-os/worker-critical exec node --test --import tsx src/outbox/outbox-dispatcher.test.ts
          run_test safe-return-url pnpm --filter @booking-os/web-console exec node --test --import tsx src/lib/safe-return-url.test.ts
          run_test web-security-headers pnpm --filter @booking-os/web-console exec node --test --import tsx src/lib/security/web-security-headers.test.ts
          run_test api-unit-suite pnpm --filter @booking-os/api test
          echo "$status" > "$GITHUB_WORKSPACE/task5-exit.txt"
          exit 0
      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task5-diagnostic-output
          path: |
            task5-diagnostic.log
            task5-exit.txt
      - name: Preserve regression exit status
        if: always()
        run: exit "$(cat task5-exit.txt)"
