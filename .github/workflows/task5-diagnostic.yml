name: Task 5 diagnostic

on:
  push:
    branches:
      - feat/sprint-1b-04-task4-authorization-endpoint

permissions:
  contents: write

jobs:
  format-security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Format security policy
        run: pnpm exec biome format --write apps/api/src/common/http/http-security.interceptor.ts
      - name: Restrict formatter diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -v '^apps/api/src/common/http/http-security.interceptor.ts$' || true)"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected formatter changes:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/common/http/http-security.interceptor.ts
          git commit -m "style: format Task 5 security policy"
          git push origin HEAD:feat/sprint-1b-04-task4-authorization-endpoint
