name: Fix tenant host domain policy

on:
  push:
    branches:
      - fix/tenant-host-domain-allowlist
    paths:
      - .github/workflows/fix-tenant-host-domain.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_os_test
      REDIS_URL: redis://127.0.0.1:6379/1
      SESSION_SECRET: test-only-session-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
      TENANT_BASE_DOMAIN: example.com
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/tenant-host-domain-allowlist

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Add regression test only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/api/src/modules/tenancy/domain/tenant-slug.test.ts")
          content = path.read_text()
          marker = 'test("rejects tenant slugs on an unconfigured parent domain", () => {'
          if marker in content:
              raise SystemExit("Regression test already exists")
          content += '''\n\ntest("rejects tenant slugs on an unconfigured parent domain", () => {\n  assert.equal(tenantSlugFromHostname("tenant-a.attacker.test", "example.com"), undefined);\n});\n'''
          path.write_text(content)
          PY

      - name: Verify regression test is RED
        run: |
          set +e
          pnpm --filter @booking-os/api exec node --test --import tsx src/modules/tenancy/domain/tenant-slug.test.ts > /tmp/red.log 2>&1
          status=$?
          set -e
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected the host-domain regression test to fail before the fix."
            exit 1
          fi
          grep -q "rejects tenant slugs on an unconfigured parent domain" /tmp/red.log

      - name: Apply tenant base-domain fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              content = file.read_text()
              actual = content.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old!r}")
              file.write_text(content.replace(old, new, count))

          Path("apps/api/src/modules/tenancy/domain/tenant-slug.ts").write_text('''import { isIP } from "node:net";\n\nconst HOST_LABEL_PATTERN = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/;\n\nfunction normalizedDomain(value: string): string | undefined {\n  const normalized = value.trim().toLowerCase();\n  if (!normalized.includes(".") || isIP(normalized) !== 0) {\n    return undefined;\n  }\n\n  const labels = normalized.split(".");\n  if (labels.some((label) => !HOST_LABEL_PATTERN.test(label))) {\n    return undefined;\n  }\n\n  return normalized;\n}\n\nexport function tenantSlugFromHostname(\n  hostname: string,\n  tenantBaseDomain: string,\n): string | undefined {\n  const normalizedHostname = normalizedDomain(hostname);\n  const normalizedBaseDomain = normalizedDomain(tenantBaseDomain);\n  if (!normalizedHostname || !normalizedBaseDomain) {\n    return undefined;\n  }\n\n  const suffix = `.${normalizedBaseDomain}`;\n  if (!normalizedHostname.endsWith(suffix)) {\n    return undefined;\n  }\n\n  const slug = normalizedHostname.slice(0, -suffix.length);\n  return HOST_LABEL_PATTERN.test(slug) ? slug : undefined;\n}\n''')

          slug_test = Path("apps/api/src/modules/tenancy/domain/tenant-slug.test.ts")
          content = slug_test.read_text()
          replacements = {
              'tenantSlugFromHostname("tenant-a.example.com")': 'tenantSlugFromHostname("tenant-a.example.com", "example.com")',
              'tenantSlugFromHostname("TENANT-A.EXAMPLE.COM")': 'tenantSlugFromHostname("TENANT-A.EXAMPLE.COM", "EXAMPLE.COM")',
              'tenantSlugFromHostname("-invalid.example.com")': 'tenantSlugFromHostname("-invalid.example.com", "example.com")',
              'tenantSlugFromHostname("127.0.0.1")': 'tenantSlugFromHostname("127.0.0.1", "example.com")',
              'tenantSlugFromHostname("localhost")': 'tenantSlugFromHostname("localhost", "example.com")',
          }
          for old, new in replacements.items():
              if old not in content:
                  raise SystemExit(f"Missing tenant slug test expression: {old}")
              content = content.replace(old, new)
          marker = 'assert.equal(tenantSlugFromHostname("tenant-a.attacker.test", "example.com"), undefined);'
          content = content.replace(
              marker,
              marker + '\n  assert.equal(tenantSlugFromHostname("tenant-a.eu.example.com", "example.com"), undefined);',
              1,
          )
          slug_test.write_text(content)

          Path("apps/api/src/modules/tenancy/application/use-cases/resolve-tenant.use-case.ts").write_text('''import type { ResolvedTenant } from "../../domain/resolved-tenant.js";\nimport { tenantSlugFromHostname } from "../../domain/tenant-slug.js";\nimport type { TenantDirectoryPort } from "../ports/tenant-directory.port.js";\n\nexport class ResolveTenantUseCase {\n  private readonly tenants: TenantDirectoryPort;\n  private readonly tenantBaseDomain: string;\n\n  constructor(tenants: TenantDirectoryPort, tenantBaseDomain: string) {\n    this.tenants = tenants;\n    this.tenantBaseDomain = tenantBaseDomain;\n  }\n\n  async execute(hostname: string): Promise<ResolvedTenant | null> {\n    const slug = tenantSlugFromHostname(hostname, this.tenantBaseDomain);\n    if (!slug) {\n      return null;\n    }\n\n    return this.tenants.findActiveBySlug(slug);\n  }\n}\n''')

          replace(
              "apps/api/src/modules/tenancy/application/use-cases/resolve-tenant.use-case.test.ts",
              "new ResolveTenantUseCase(directory)",
              'new ResolveTenantUseCase(directory, "example.com")',
              2,
          )
          resolve_test = Path("apps/api/src/modules/tenancy/application/use-cases/resolve-tenant.use-case.test.ts")
          resolve_test.write_text(resolve_test.read_text() + '''\n\ntest("does not query the directory for a foreign parent domain", async () => {\n  let calls = 0;\n  const directory: TenantDirectoryPort = {\n    async findActiveBySlug() {\n      calls += 1;\n      return null;\n    },\n  };\n  const useCase = new ResolveTenantUseCase(directory, "example.com");\n\n  const result = await useCase.execute("tenant-a.attacker.test");\n\n  assert.equal(result, null);\n  assert.equal(calls, 0);\n});\n''')

          Path("apps/api/src/config/environment.schema.ts").write_text('''import { z } from "zod";\n\nimport { LOG_LEVELS, NODE_ENVIRONMENTS } from "./environment.constants.js";\n\nconst hostLabelPattern = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i;\n\nconst apiPrefixSchema = z\n  .string()\n  .trim()\n  .min(1, "API_PREFIX cannot be empty")\n  .regex(/^[a-z0-9]+(?:-[a-z0-9]+)*$/, "API_PREFIX must use lowercase kebab-case without slashes");\n\nconst tenantBaseDomainSchema = z\n  .string()\n  .trim()\n  .refine(\n    (value) => value.includes(".") && value.split(".").every((label) => hostLabelPattern.test(label)),\n    "TENANT_BASE_DOMAIN must be a valid multi-label hostname",\n  )\n  .transform((value) => value.toLowerCase());\n\nconst rawEnvironmentSchema = z\n  .object({\n    NODE_ENV: z.enum(NODE_ENVIRONMENTS).default("development"),\n\n    HOST: z.string().trim().min(1).default("0.0.0.0"),\n\n    TRUST_PROXY: z.enum(["true", "false"]).default("false"),\n\n    TENANT_BASE_DOMAIN: tenantBaseDomainSchema.optional(),\n\n    PORT: z.coerce.number().int().min(1).max(65_535).default(3001),\n\n    API_PREFIX: apiPrefixSchema.default("api"),\n\n    APP_VERSION: z.string().trim().min(1).default("0.1.0"),\n\n    LOG_LEVEL: z.enum(LOG_LEVELS).default("info"),\n\n    DATABASE_URL: z\n      .string()\n      .trim()\n      .url("DATABASE_URL must be a valid URL")\n      .refine(\n        (value) => value.startsWith("postgresql://") || value.startsWith("postgres://"),\n        "DATABASE_URL must use the postgresql:// or postgres:// protocol",\n      ),\n\n    REDIS_URL: z\n      .string()\n      .trim()\n      .url("REDIS_URL must be a valid URL")\n      .refine(\n        (value) => value.startsWith("redis://") || value.startsWith("rediss://"),\n        "REDIS_URL must use the redis:// or rediss:// protocol",\n      ),\n\n    READINESS_TIMEOUT_MS: z.coerce.number().int().min(100).max(5000).default(750),\n\n    SESSION_SECRET: z.string().min(32, "SESSION_SECRET must contain at least 32 characters"),\n\n    PAYMENT_PROVIDER: z.enum(["mock", "payos"]).default("mock"),\n  })\n  .superRefine((values, context) => {\n    if (values.NODE_ENV === "production" && !values.TENANT_BASE_DOMAIN) {\n      context.addIssue({\n        code: "custom",\n        path: ["TENANT_BASE_DOMAIN"],\n        message: "TENANT_BASE_DOMAIN is required in production",\n      });\n    }\n\n    if (values.NODE_ENV === "production" && values.PAYMENT_PROVIDER === "mock") {\n      context.addIssue({\n        code: "custom",\n        path: ["PAYMENT_PROVIDER"],\n        message: "PAYMENT_PROVIDER cannot be mock in production",\n      });\n    }\n  });\n\nexport const environmentSchema = rawEnvironmentSchema.transform((values) => ({\n  nodeEnvironment: values.NODE_ENV,\n  host: values.HOST,\n  trustProxy: values.TRUST_PROXY === "true",\n  tenantBaseDomain: values.TENANT_BASE_DOMAIN ?? "example.com",\n  port: values.PORT,\n  apiPrefix: values.API_PREFIX,\n  appVersion: values.APP_VERSION,\n  logLevel: values.LOG_LEVEL,\n  databaseUrl: values.DATABASE_URL,\n  redisUrl: values.REDIS_URL,\n  readinessTimeoutMs: values.READINESS_TIMEOUT_MS,\n  sessionSecret: values.SESSION_SECRET,\n  paymentProvider: values.PAYMENT_PROVIDER,\n}));\n\nexport type Environment = z.output<typeof environmentSchema>;\n\nexport type RawEnvironment = z.input<typeof environmentSchema>;\n''')

          replace(
              "apps/api/src/config/environment.service.ts",
              '''  get trustProxy(): boolean {\n    return this.values.trustProxy;\n  }\n\n''',
              '''  get trustProxy(): boolean {\n    return this.values.trustProxy;\n  }\n\n  get tenantBaseDomain(): string {\n    return this.values.tenantBaseDomain;\n  }\n\n''',
          )

          replace(
              "apps/api/src/modules/tenancy/tenancy.module.ts",
              'import { DatabaseModule } from "../../database/database.module.js";\n',
              'import { EnvironmentService } from "../../config/environment.service.js";\nimport { DatabaseModule } from "../../database/database.module.js";\n',
          )
          replace(
              "apps/api/src/modules/tenancy/tenancy.module.ts",
              '''      inject: [TENANT_DIRECTORY_PORT],\n      useFactory: (directory: TenantDirectoryPort): ResolveTenantUseCase =>\n        new ResolveTenantUseCase(directory),\n''',
              '''      inject: [TENANT_DIRECTORY_PORT, EnvironmentService],\n      useFactory: (\n        directory: TenantDirectoryPort,\n        environment: EnvironmentService,\n      ): ResolveTenantUseCase =>\n        new ResolveTenantUseCase(directory, environment.tenantBaseDomain),\n''',
          )

          schema_test = Path("apps/api/src/config/environment.schema.test.ts")
          content = schema_test.read_text()
          content = content.replace('  TRUST_PROXY: "true",\n', '  TRUST_PROXY: "true",\n  TENANT_BASE_DOMAIN: "Example.COM",\n', 1)
          content = content.replace('    trustProxy: true,\n', '    trustProxy: true,\n    tenantBaseDomain: "example.com",\n', 1)
          content = content.replace(
              '  assert.equal(environment.trustProxy, false);\n',
              '  assert.equal(environment.trustProxy, false);\n  assert.equal(environment.tenantBaseDomain, "example.com");\n',
              1,
          )
          content = content.replace(
              '\ntest("parseEnvironment returns an immutable result", () => {',
              '''\n\ntest("parseEnvironment rejects a missing tenant base domain in production", () => {\n  assert.throws(\n    () =>\n      parseEnvironment({\n        ...validEnvironment,\n        NODE_ENV: "production",\n        TENANT_BASE_DOMAIN: undefined,\n        PAYMENT_PROVIDER: "payos",\n      }),\n    /TENANT_BASE_DOMAIN/,\n  );\n});\n\ntest("parseEnvironment returns an immutable result", () => {''',
              1,
          )
          schema_test.write_text(content)

          for path in Path("apps/api").rglob("*.ts"):
              content = path.read_text()
              if ": Environment = {" not in content or "tenantBaseDomain:" in content:
                  continue
              lines = content.splitlines()
              for index, line in enumerate(lines):
                  if line.strip().startswith("trustProxy:"):
                      indent = line[: len(line) - len(line.lstrip())]
                      lines.insert(index + 1, indent + 'tenantBaseDomain: "example.com",')
                      path.write_text("\n".join(lines) + ("\n" if content.endswith("\n") else ""))
                      break

          e2e = Path("apps/api/test/tenant-resolution.e2e.test.ts")
          content = e2e.read_text()
          content = content.replace(
              '  TRUST_PROXY: process.env.TRUST_PROXY,\n',
              '  TRUST_PROXY: process.env.TRUST_PROXY,\n  TENANT_BASE_DOMAIN: process.env.TENANT_BASE_DOMAIN,\n',
              1,
          )
          content = content.replace(
              '  process.env.TRUST_PROXY = String(trustProxy);\n',
              '  process.env.TRUST_PROXY = String(trustProxy);\n  process.env.TENANT_BASE_DOMAIN = "example.com";\n',
              1,
          )
          content = content.replace(
              '''test("unknown and non-tenant hosts fail closed", async () => {\n  await probeRequest(directHostApp, "unknown.example.com").expect(404);\n  await probeRequest(directHostApp, "localhost").expect(404);\n});\n''',
              '''test("unknown, foreign-domain, and non-tenant hosts fail closed", async () => {\n  await probeRequest(directHostApp, "unknown.example.com").expect(404);\n  await probeRequest(directHostApp, "resolution-a.attacker.test").expect(404);\n  await probeRequest(directHostApp, "resolution-a.eu.example.com").expect(404);\n  await probeRequest(directHostApp, "localhost").expect(404);\n});\n''',
              1,
          )
          content = content.replace(
              '''test("enabled proxy trust uses only the first forwarded host", async () => {\n  const response = await probeRequest(trustedProxyApp, "api.internal")\n    .set("x-forwarded-host", "resolution-b.example.com, proxy.internal")\n    .expect(200);\n\n  assert.deepEqual(probePairs(response.body as ProbeResponse[]), [\n    [TENANT_B_ID, "resolution-visible-to-b"],\n  ]);\n});\n''',
              '''test("enabled proxy trust uses only the first allowlisted forwarded host", async () => {\n  const response = await probeRequest(trustedProxyApp, "api.internal")\n    .set("x-forwarded-host", "resolution-b.example.com, proxy.internal")\n    .expect(200);\n\n  assert.deepEqual(probePairs(response.body as ProbeResponse[]), [\n    [TENANT_B_ID, "resolution-visible-to-b"],\n  ]);\n\n  await probeRequest(trustedProxyApp, "api.internal")\n    .set("x-forwarded-host", "resolution-b.attacker.test, proxy.internal")\n    .expect(404);\n});\n''',
              1,
          )
          e2e.write_text(content)

          replace(
              "apps/api/.env.example",
              "TRUST_PROXY=false\n",
              "TRUST_PROXY=false\nTENANT_BASE_DOMAIN=example.com\n",
          )
          replace(
              "scripts/assert-production-config.mjs",
              '    API_PREFIX: "api",\n',
              '    API_PREFIX: "api",\n    TENANT_BASE_DOMAIN: "example.com",\n',
          )

          readme = Path("README.md")
          content = readme.read_text()
          content = content.replace(
              "READINESS_TIMEOUT_MS=750\nTRUST_PROXY=false\n",
              "READINESS_TIMEOUT_MS=750\nTRUST_PROXY=false\nTENANT_BASE_DOMAIN=example.com\n",
              1,
          )
          content = content.replace(
              "`READINESS_TIMEOUT_MS` is validated from `100` through `5000` milliseconds. `TRUST_PROXY` defaults to `false` and accepts only the literal strings `true` or `false`. Enable it only when the API is behind a configured trusted proxy.",
              "`READINESS_TIMEOUT_MS` is validated from `100` through `5000` milliseconds. `TRUST_PROXY` defaults to `false` and accepts only the literal strings `true` or `false`. Enable it only when the API is behind a configured trusted proxy. `TENANT_BASE_DOMAIN` defaults to `example.com` in development and test, and must be explicitly configured in production.",
              1,
          )
          content = content.replace(
              "Tenant identity is resolved only from the effective hostname. Request bodies, query parameters, and client-provided tenant, actor, or source headers are never authorization inputs. With `TRUST_PROXY=false`, `Host` is authoritative; with `TRUST_PROXY=true`, only the first `x-forwarded-host` value is considered.",
              "Tenant identity is resolved only from an allowlisted effective hostname of the form `<tenant>.<TENANT_BASE_DOMAIN>`. Foreign parent domains and nested subdomains fail closed. Request bodies, query parameters, and client-provided tenant, actor, or source headers are never authorization inputs. With `TRUST_PROXY=false`, `Host` is considered only after the base-domain check; with `TRUST_PROXY=true`, only the first `x-forwarded-host` value is considered and it must pass the same check.",
              1,
          )
          readme.write_text(content)
          PY

      - name: Format changes
        run: pnpm exec biome check --write apps/api/src apps/api/test scripts/assert-production-config.mjs

      - name: Apply database migrations
        run: pnpm --filter @booking-os/api prisma:migrate:deploy

      - name: Verify focused regression GREEN
        run: pnpm --filter @booking-os/api exec node --test --import tsx src/modules/tenancy/domain/tenant-slug.test.ts src/modules/tenancy/application/use-cases/resolve-tenant.use-case.test.ts

      - name: Verify static and architecture gates
        run: |
          pnpm check:ci
          pnpm verify:architecture
          pnpm typecheck

      - name: Verify tests and production configuration
        run: |
          pnpm test
          pnpm test:e2e:api
          pnpm verify:production-config

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/api scripts/assert-production-config.mjs
          git commit -m "fix: restrict tenant resolution to configured domain"
          git push origin HEAD:fix/tenant-host-domain-allowlist
