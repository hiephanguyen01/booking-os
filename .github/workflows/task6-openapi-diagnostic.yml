name: Task 6 OpenAPI diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generated-diagnostic:
    name: Generated artifact diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      API_PREFIX: api
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:1/booking_os_openapi
      REDIS_URL: redis://127.0.0.1:1/15
      SESSION_SECRET: openapi-ci-only-secret-at-least-32-characters
      PAYMENT_PROVIDER: mock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate and expose drift
        shell: bash
        run: |
          set +e
          pnpm api:generate 2>&1 | tee /tmp/task6-openapi-generate.log
          generation_status=${PIPESTATUS[0]}
          set -e

          if [ "$generation_status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path
          text = Path("/tmp/task6-openapi-generate.log").read_text(encoding="utf-8", errors="replace")[-16000:]
          safe = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Task 6 OpenAPI generation failure::{safe}")
          PY
            exit "$generation_status"
          fi

          generated=(
            packages/contracts/openapi/openapi.json
            packages/api-client/src/generated/schema.ts
            packages/api-client/src/generated/client.ts
          )
          drift=$(git status --porcelain=v1 --untracked-files=all -- "${generated[@]}")
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift" > /tmp/task6-generated-status.txt
            git diff -- "${generated[@]}" > /tmp/task6-generated.diff
            python - <<'PY'
          from pathlib import Path

          status = Path("/tmp/task6-generated-status.txt").read_text(encoding="utf-8", errors="replace").strip()
          diff = Path("/tmp/task6-generated.diff").read_text(encoding="utf-8", errors="replace")
          if len(diff) > 24000:
              diff = diff[:24000] + "\n...diff truncated..."
          text = f"Generated status:\n{status}\n\nDiff:\n{diff}"
          safe = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Task 6 generated artifact drift::{safe}")
          PY
            exit 1
          fi

          echo "Generated artifacts are current."
