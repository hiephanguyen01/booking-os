name: Plan 2 temporary index alignment

on:
  push:
    branches:
      - feat/sprint-1b-02-session-kernel

permissions:
  contents: write

jobs:
  align-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-1b-02-session-kernel

      - name: Align Prisma index name
        run: |
          sed -i 's/auth_sessions_expiry_idx/auth_sessions_idle_expires_at_absolute_expires_at_idx/' \
            apps/api/prisma/migrations/20260805_session_kernel/migration.sql

      - name: Commit aligned migration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/migrations/20260805_session_kernel/migration.sql
          git commit -m "fix(session): align Prisma session expiry index"
          git push origin HEAD:feat/sprint-1b-02-session-kernel
