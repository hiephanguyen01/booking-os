name: Update API dependency lockfile

on:
  push:
    branches:
      - feat/api-observability-readiness

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.event.head_commit.message == 'chore(api): add dependency manifests'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/api-observability-readiness

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Update lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(api): update dependency lockfile"
          git push origin HEAD:feat/api-observability-readiness
