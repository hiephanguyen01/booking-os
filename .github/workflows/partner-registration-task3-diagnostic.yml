name: Partner Registration Task 3 Diagnostic

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/partner-registration-task3-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: partner-registration-task3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: Task 3 ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: rollback
            pattern: Partner registration rolls every earlier establishment stage back on a later failure
          - scenario: successful-commit
            pattern: successful establishment commits all rows before post-commit Partner session issuance
          - scenario: concurrency
            pattern: concurrent verified completions converge to one Partner and one active owner assignment
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_os_task3_diagnostic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_os_task3_diagnostic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://booking:booking@127.0.0.1:5432/booking_os_task3_diagnostic
      NODE_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @booking-os/api prisma:migrate:deploy

      - name: Prepare API test dependencies
        run: pnpm turbo run test --filter=@booking-os/api

      - name: Run Task 3 scenario
        run: >-
          cd apps/api && pnpm exec node --test --test-concurrency=1 --import tsx
          --test-name-pattern="${{ matrix.pattern }}"
          test/partner-registration-concurrency.e2e.test.ts
