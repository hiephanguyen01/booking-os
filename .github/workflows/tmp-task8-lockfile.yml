name: Temporary Task 8 workspace sync

on:
  push:
    branches:
      - feat/sprint-1b-03-task-5-tenant-admin-invitations

permissions:
  contents: write

jobs:
  sync-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: feat/sprint-1b-03-task-5-tenant-admin-invitations
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies and sync lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format Task 8 files
        run: >-
          pnpm exec biome check --write
          apps/web-console
          e2e/platform-tenant-onboarding.spec.ts
          e2e/invitation-membership.spec.ts
      - name: Commit workspace updates when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web-console pnpm-lock.yaml e2e/platform-tenant-onboarding.spec.ts e2e/invitation-membership.spec.ts
          git commit -m "style(web-console): format Task 8 workspace"
          git push origin HEAD:feat/sprint-1b-03-task-5-tenant-admin-invitations
